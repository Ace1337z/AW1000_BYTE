# ================================================================
# BYTE by ACE - sysctl tuning for the AW1000 (IPQ8071A, 884 MB RAM)
#
# Tuning philosophy: stability first, then throughput.
#
# The link is 5G NSA (~100-300 Mbit/s typical, MTU 1500). Buffer sizes
# are sized from the bandwidth-delay product of that link, not from
# server-class defaults:
#
#   300 Mbit/s x 60 ms worst-case RTT = ~2.25 MB
#   4 MB cap gives ~1.8x headroom for burst absorption.
#
# Anything larger is pure waste: per-socket caps are only *limits*, but
# they let badly-behaved or many-socket workloads pin memory that the
# kernel then cannot reclaim fast enough, which is the classic cause of
# router OOM under load (and OOM-killing dnscache/xray is what actually
# drops a user's internet). DOTYWRT, which is the known-good reference
# for this exact box, keeps the 208 KB defaults.
# ================================================================

# ---- queue discipline ------------------------------------------
# BBR is designed to work with sch_fq: fq keeps a per-flow pacing schedule
# so BBR can send at its computed rate instead of dumping bursts into the
# driver queue. fq_codel (the OpenWrt default) does not pace, which is why
# BBR on a stock image still shows high latency under load.
# This is a latency win, not a throughput one - it does not reduce speed.
net.core.default_qdisc = fq

# ---- congestion control ----------------------------------------
# BBR is the right choice for lossy cellular links: it does not collapse
# the window on non-congestive loss the way cubic does, and it keeps the
# queue small (lower latency, less bufferbloat, lower CPU in the qdisc).
net.ipv4.tcp_congestion_control = bbr

# ---- socket buffers (BDP-sized, see above) ---------------------
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
net.core.rmem_default = 262144
net.core.wmem_default = 262144

# ---- accept queues ---------------------------------------------
# 4096 matches DOTYWRT. The old 65535 preallocated a large queue for a
# router that will never see that many pending connections.
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096

# ---- TIME_WAIT handling ----------------------------------------
# Safe on a NAT gateway and cheap: reuses sockets instead of holding them.
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 30

# ---- TCP extensions (all default-on, kept explicit) -----------
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_dsack = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_syncookies = 1

# TFO client-side only. "3" enables server-side TFO too, which on a
# router means additional state tracking for no benefit (nothing
# connects *to* this box over TCP in normal use).
net.ipv4.tcp_fastopen = 1

# Path MTU probing: leave at the kernel default. Mode 2 probes every
# flow, which costs CPU per connection to fix a problem that does not
# occur on a single-homed cellular uplink; mode 1 (on blackhole only)
# is the balanced choice.
net.ipv4.tcp_mtu_probing = 1

# ---- forwarding ------------------------------------------------
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# ---- conntrack -------------------------------------------------
# 32768 matches DOTYWRT and is ample for a household (~65k sockets,
# each entry ~300 B => ~10 MB rootfs RAM). Doubling it to 65536 cost
# another ~10 MB pinned for a table that never fills.
net.netfilter.nf_conntrack_max = 32768
# Keep accounting out of the fast path.
net.netfilter.nf_conntrack_tcp_no_window_check = 1
net.netfilter.nf_conntrack_log_invalid = 0
# Drop idle established flows sooner than the 5-day default so the table
# genuinely recycles (DOTYWRT uses 7440).
net.netfilter.nf_conntrack_tcp_timeout_established = 7440
net.netfilter.nf_conntrack_udp_timeout = 60
net.netfilter.nf_conntrack_udp_timeout_stream = 180

# ---- file descriptors -----------------------------------------
fs.file-max = 100000

# ---- packet processing budget ----------------------------------
# Let the softirq path batch more work per wakeup instead of being
# rescheduled constantly. Fewer context switches per packet = lower CPU
# at high throughput; 600 packets keeps latency low enough for VoIP.
net.core.netdev_budget = 600
# net.core.netdev_budget_usecs is intentionally NOT set: on kernel 6.12 it is
# read-only (fixed at 20000) and writing it returns EINVAL. When sysctl -p
# hits an invalid key it aborts the REST of the file, so everything after it -
# including tcp_slow_start_after_idle below - silently never applied. That is
# why the router ran with slow_start_after_idle=1 despite this file saying 0.
# Per-CPU backlog queue. The old default (1000) drops bursts on a 5G link
# before WiFi can drain them.
net.core.netdev_max_backlog = 2000
# Weight each device gets per softirq round; default 64 is too small for
# 1 Gbit-class WiFi.
net.core.dev_weight = 64
# Disable slow-start after idle: avoids a latency spike on the first
# packet of a burst (matters for interactive/gaming traffic).
net.ipv4.tcp_slow_start_after_idle = 0
# Keepalive tuning, biased to latency over power: notice a dead peer fast
# and keep NAT/proxy conntrack entries warm, so the first packet after an
# idle period is not dropped or delayed. The default 7200 s idle timer is
# exactly what makes a tailscale/ssh session stall after a pause.
net.ipv4.tcp_keepalive_time = 120
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 4
