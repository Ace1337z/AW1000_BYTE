name: Build BYTE by ACE firmware (AW1000)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: ImmortalWrt branch to build
        required: false
        default: openwrt-25.12
  push:
    branches: [main]
    paths:
      - preset
      - aw1000_byte.sh
      - files/**
      - .github/workflows/build.yml

permissions:
  contents: write

jobs:
  build:
    name: Build BYTE by ACE (ImmortalWrt ipk) for AW1000
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      CI: "1"
      TARGET_BRANCH: ${{ github.event.inputs.branch || 'openwrt-25.12' }}
      SKIP_MENUCONFIG: "1"

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev \
            lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads and ccache
        uses: actions/cache@v4
        with:
          path: |
            builder/immortalwrt/dl
            builder/immortalwrt/.ccache
          key: aw1000-${{ env.TARGET_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            aw1000-${{ env.TARGET_BRANCH }}-

      - name: Install opkg repo signing key
        if: github.ref_name == 'main'
        run: |
          # A stable key keeps the image and the published repo in agreement.
          # base-files only generates key-build when it is missing, so a
          # committed key is reused by every future build. Without this each
          # run invents a new key: the image ships key N, the repo is signed
          # with key N, but the NEXT build replaces the repo with key N+1 while
          # devices still hold key N. opkg then prints "Updated list" while
          # discarding every index, leaving /var/opkg-lists empty and nothing
          # installable - a silent failure.
          bash builder/.github/install-repo-key.sh builder/immortalwrt builder/repo-key

      - name: Build firmware
        working-directory: builder
        run: |
          # The script clones immortalwrt/, appends feeds, applies preset + files,
          # runs defconfig, and builds. Non-interactive because CI=1 and
          # SKIP_MENUCONFIG=1 are exported at job level.
          bash aw1000_byte.sh

      - name: Collect artifacts
        run: |
          mkdir -p out
          # Copy the target output tree (images + metadata), skipping the packages dir.
          rsync -a --exclude 'packages' \
            builder/immortalwrt/bin/targets/qualcommax/ipq807x/ out/ || true
          find out -type f | sort
          test -n "$(find out -name '*.bin' -o -name '*.itb')" || {
            echo "No firmware images produced"; exit 1; }

      - name: Build on-demand packages
        run: |
          # OpenClash, AdGuard Home, Nikki, SQM and friends are published in the
          # opkg repo but kept out of the image: they would roughly double the
          # firmware size, and OpenClash's redirect rules can bypass the
          # nftables chain that applies the TTL rewrite.
          bash builder/.github/build-ondemand-packages.sh builder/immortalwrt

      - name: Build self-hosted opkg repository
        run: |
          # ImmortalWrt 25.12 publishes only apk feeds, so an opkg image has
          # nowhere to update from. This packages the .ipk set the build just
          # produced into a repo laid out like downloads.immortalwrt.org, and
          # signs each index with this build's key (which the image installs
          # into /etc/opkg/keys, so the device trusts it automatically).
          MANIFEST=$(ls builder/immortalwrt/bin/targets/qualcommax/ipq807x/*.manifest 2>/dev/null | head -1)
          # Without the manifest the builder publishes every .ipk left in
          # bin/packages (116M instead of 49M) and re-advertises removed
          # packages, so treat its absence as a hard failure.
          test -n "$MANIFEST" || { echo "::error::no .manifest in target output"; exit 1; }
          echo "filtering repo against $MANIFEST"
          bash builder/.github/build-package-repo.sh \
            builder/immortalwrt repo "$MANIFEST"
          du -sh repo
          find repo -name Packages.gz | sort

      - name: Publish opkg repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The repo must be browsable as a directory tree for opkg to fetch
          # <feed>/Packages.gz. Release assets are flat files, so it lives on
          # a dedicated orphan 'repo' branch that raw.githubusercontent.com
          # serves path-by-path. Rewritten every build: no history to keep.
          cd repo
          git init -q -b repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # --allow-empty: a re-run can produce an identical tree, and a bare
          # `git commit` would then exit non-zero and fail the whole job.
          git commit -q --allow-empty -m "opkg repo for build ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo:repo
          echo "published $(find . -name '*.ipk' | wc -l) packages to branch 'repo'"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: BYTE_by_ACE-aw1000-${{ env.TARGET_BRANCH }}
          path: out/*
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: BYTE_by_ACE-FINAL-${{ env.TARGET_BRANCH }}-${{ github.run_number }}
          TITLE: BYTE by ACE — FINAL (AW1000, ImmortalWrt ${{ env.TARGET_BRANCH }})
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # A previous run may have left a bare tag without a release object,
          # in which case `gh release create` fails. Delete a release-less tag
          # first (a real release and its assets are left untouched).
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1; then
            if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "tag $TAG exists without a release; removing the stale tag"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || true
            fi
          fi

          # Release body is generated from the artifacts that were actually
          # built (commit, kernel, feed pins, image size), so it can never
          # describe a firmware that was not produced.
          OUT_DIR=out bash builder/.github/release-notes-final.sh \
            builder/immortalwrt/bin/targets/qualcommax/ipq807x out > /tmp/notes.md
          echo "--- release notes ---"
          cat /tmp/notes.md
          # An empty or stub body means the generator broke; fail loudly
          # rather than publishing a release that says nothing about itself.
          test "$(wc -l < /tmp/notes.md)" -ge 20 || {
            echo "::error::generated release notes are too short"; exit 1; }

          gh release create "$TAG" out/* \
            -R "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes-file /tmp/notes.md

          # Never trust the upload: confirm the release really carries the image.
          count=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
                    --jq '[.assets[] | select(.name | test("squashfs-sysupgrade.bin$"))] | length')
          echo "sysupgrade assets on release: $count"
          test "$count" -ge 1 || { echo "::error::release $TAG has no sysupgrade image"; exit 1; }
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "  \(.name)  \(.size) bytes"'
